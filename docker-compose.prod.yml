services:
  goggles-db:
    image: mariadb:11.8.6
    # Set max_allowed_packet to 512M (this should prevent the "MySQL server has gone away"
    # issue due to timeout when running huge queries)
    command: --max_allowed_packet=67108864
    container_name: goggles-db
    env_file:
      - .env
    # Localhost only: use SSH tunnel for remote admin access (never publish on 0.0.0.0).
    ports:
      - '127.0.0.1:33060:3306'
    restart: always
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - "~/Projects/goggles_deploy/db.prod:/var/lib/mysql"
    # ~1.9GB droplet: keep every container individually bounded so the OOM
    # killer targets the offender instead of livelocking the host.
    mem_limit: 448m
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    # Since vers. 0.9+, we dropped the "prod-" prefix from the tag:
    image: "${DOCKERHUB_USERNAME:-steveoro}/goggles-api:${TAG:-latest}"
    depends_on:
      - goggles-db
    container_name: goggles-api
    env_file:
      - .env
    # Reachable only via reverse proxy on the host (or SSH tunnel).
    ports:
      - '127.0.0.1:8081:8081'
    restart: always
    # DAC_OVERRIDE: container runs as root but host bind mounts are owned by deploy (600 keys, storage).
    # Without it, cap_drop ALL makes even root hit EACCES on those paths.
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - "~/Projects/goggles_deploy/storage.prod:/app/storage"
      - "~/Projects/goggles_deploy/backups:/app/db/dump"
      - "~/Projects/goggles_deploy/log.prod/api:/app/log"
      - type: bind
        source: "~/Projects/goggles_deploy/master-api.key"
        target: /app/config/master.key
        read_only: true

  main:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: "${DOCKERHUB_USERNAME:-steveoro}/goggles-main:${TAG:-latest}"
    depends_on:
      - goggles-db
      - api
    container_name: goggles-main
    env_file:
      - .env
    # Reachable only via reverse proxy on the host (or SSH tunnel).
    ports:
      - '127.0.0.1:8080:8080'
    restart: always
    # Entrypoint still needs root for sSMTP rewriting; drop kernel capabilities instead.
    # DAC_OVERRIDE: see api service comment (master.key + storage.prod owned by deploy).
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    # autoheal only matches the label value "true" (list syntax `- autoheal` sets "" and is ignored).
    labels:
      autoheal: "true"
    healthcheck:
      # force_ssl redirects plain HTTP -> HTTPS; the forwarded-proto header makes
      # request.ssl? true so the probe gets a real 200 instead of a 301.
      test: ["CMD-SHELL", "wget -q -O /dev/null --header='X-Forwarded-Proto: https' http://127.0.0.1:8080/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - "~/Projects/goggles_deploy/storage.prod:/app/storage"
      - "~/Projects/goggles_deploy/backups:/app/db/dump"
      - "~/Projects/goggles_deploy/log.prod:/app/log"
      - type: bind
        source: "~/Projects/goggles_deploy/master-main.key"
        target: /app/config/master.key
        read_only: true

  jobs:
    # Same image as `main`, different entrypoint: Solid Queue supervisor only.
    # Waits for `main` to be healthy => db:prepare has already created/migrated
    # the goggles_queue & goggles_cable databases.
    image: "${DOCKERHUB_USERNAME:-steveoro}/goggles-main:${TAG:-latest}"
    depends_on:
      goggles-db:
        condition: service_healthy
      main:
        condition: service_healthy
    container_name: goggles-jobs
    env_file:
      - .env
    environment:
      # Log to docker stdout (json-file driver) instead of the shared production.log:
      RAILS_LOG_TO_STDOUT: "1"
    entrypoint: ["./entrypoints/jobs.prod.sh"]
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    mem_limit: 640m
    # autoheal only matches the label value "true" (list syntax `- autoheal` sets "" and is ignored).
    labels:
      autoheal: "true"
    healthcheck:
      # Liveness = fresh Solid Queue heartbeats (any supervisor/worker row < 3 min old).
      # Uses mariadb-client already present in the image — no Rails boot needed.
      test: ["CMD-SHELL", "mariadb -h goggles-db -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" goggles_queue -sN -e 'SELECT 1 FROM solid_queue_processes WHERE last_heartbeat_at > NOW() - INTERVAL 180 SECOND LIMIT 1' | grep -q 1"]
      interval: 120s
      timeout: 15s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - "~/Projects/goggles_deploy/storage.prod:/app/storage"
      - "~/Projects/goggles_deploy/backups:/app/db/dump"
      - type: bind
        source: "~/Projects/goggles_deploy/master-main.key"
        target: /app/config/master.key
        read_only: true

  # Restarts labeled containers that stay `unhealthy` (e.g. a hung Puma).
  autoheal:
    # Upstream only maintains the `latest` tag (versioned tags are stale).
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "60"
    # Optional: WEBHOOK_URL=<Slack incoming webhook> for instant restart alerts (never committed).
    env_file:
      - path: slack.env
        required: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  gem_cache:
  node_modules:
