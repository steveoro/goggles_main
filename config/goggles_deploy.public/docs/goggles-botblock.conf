# goggles-botblock.conf -- deny datacenter botnet ranges on the main site.
# Loaded server-wide via conf-available; the <If> guard skips the API vhost (:447)
# so datacenter-hosted API clients stay unaffected.
# Install:  sudo cp ~/goggles-botblock.conf /etc/apache2/conf-available/
#           sudo a2enconf goggles-botblock && sudo apache2ctl configtest
#           sudo systemctl reload apache2

<Location "/">
  <If "%{SERVER_PORT} != '447'">
    <RequireAll>
      Require all granted
      # --- DigitalOcean (observed scrapers + all major DO ranges) ---
      Require not ip 45.55.0.0/16
      Require not ip 64.227.0.0/16
      Require not ip 68.183.0.0/16
      Require not ip 104.131.0.0/16
      Require not ip 104.236.0.0/16
      Require not ip 107.170.0.0/16
      Require not ip 128.199.0.0/16
      Require not ip 134.122.0.0/16
      Require not ip 134.209.0.0/16
      Require not ip 137.184.0.0/16
      Require not ip 138.68.0.0/16
      Require not ip 138.197.0.0/16
      Require not ip 139.59.0.0/16
      Require not ip 142.93.0.0/16
      Require not ip 143.110.0.0/16
      Require not ip 143.198.0.0/16
      Require not ip 144.126.0.0/16
      Require not ip 146.190.0.0/16
      Require not ip 147.182.0.0/16
      Require not ip 152.42.0.0/16
      Require not ip 157.230.0.0/16
      Require not ip 157.245.0.0/16
      Require not ip 159.65.0.0/16
      Require not ip 159.89.0.0/16
      Require not ip 159.203.0.0/16
      Require not ip 161.35.0.0/16
      Require not ip 164.90.0.0/16
      Require not ip 164.92.0.0/16
      Require not ip 165.22.0.0/16
      Require not ip 165.227.0.0/16
      Require not ip 165.232.0.0/16
      Require not ip 167.71.0.0/16
      Require not ip 167.99.0.0/16
      Require not ip 167.172.0.0/16
      Require not ip 170.64.0.0/16
      Require not ip 174.138.0.0/16
      Require not ip 178.62.0.0/16
      Require not ip 178.128.0.0/16
      Require not ip 188.166.0.0/16
      Require not ip 192.241.0.0/16
      Require not ip 206.81.0.0/16
      Require not ip 206.189.0.0/16
      Require not ip 209.97.0.0/16
      # --- Microsoft Azure (observed: 57.141.20.x, 20.x.x.x, 52.167.x.x) ---
      # 20.0.0.0/8 and 52.0.0.0/8 are almost entirely cloud egress (Azure+AWS);
      # legit browser traffic from them is essentially nonexistent.
      Require not ip 20.0.0.0/8
      Require not ip 57.141.0.0/16
      Require not ip 52.0.0.0/8
      # --- Alibaba Cloud (observed: 47.79.x.x swarm) ---
      Require not ip 47.0.0.0/8
      # --- Other hosting ranges observed in the swarm ---
      Require not ip 45.148.10.0/24
      Require not ip 168.144.0.0/16
      Require not ip 195.178.110.0/24
    </RequireAll>
  </If>
</Location>

# This site has no WordPress -- reject exploit probes outright.
<LocationMatch "^/(wp-|wordpress|xmlrpc\.php|\.env|\.git|phpmyadmin)">
  <If "%{SERVER_PORT} != '447'">
    Require all denied
  </If>
</LocationMatch>
