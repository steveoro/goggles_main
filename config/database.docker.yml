default_sqlt3: &default_sqlt3
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  schema_format: :ruby

default: &default
  adapter: mysql2
  encoding: utf8mb4
  username: <%= ENV.fetch("DATABASE_USER") { 'root' } %>
  password: <%= ENV.fetch("MYSQL_ROOT_PASSWORD") { '' } %>
  host: <%= ENV.fetch("DATABASE_HOST") { 'localhost' } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 3306 } %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  structure_dump_flags: ["--skip-ssl"]
  structure_load_flags: ["--skip-ssl"]

development:
  primary:
    <<: *default
    database: goggles_development
  queue:
    <<: *default_sqlt3
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate

test:
  primary:
    <<: *default
    database: goggles_test
  queue:
    <<: *default_sqlt3
    database: storage/test_queue.sqlite3
    migrations_paths: db/queue_migrate

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME") { 'goggles' } %>
  queue:
    <<: *default
    database: goggles_queue
    migrations_paths: db/queue_migrate
    schema_format: :ruby
  cable:
    <<: *default
    database: goggles_cable
    migrations_paths: db/cable_migrate
    schema_format: :ruby
